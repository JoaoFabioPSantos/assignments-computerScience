services:
  db:
    build: ./db
    container_name: goblins_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: goblins_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - goblins_data:/var/lib/postgresql/data

volumes:
  goblins_data: