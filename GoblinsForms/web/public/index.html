<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gnomes Forms — Registrando Trecos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>👺 Gnomes Forms</h1>
      <p>Gerencie seus gnomos e suas fórmulas matemáticas complexas</p>
    </header>

    <section class="section">
      <h2>📜 Consulta e Registros</h2>
      <div class="buttons-grid">
        <button onclick="listarTodosGnomos()" class="btn btn-primary">
          <span>👥</span> Listar Todos os Gnomos
        </button>
        <button onclick="listarTodasFormulas()" class="btn btn-secondary">
          <span>📐</span> Ver Todas as Fórmulas
        </button>
      </div>
    </section>

    <section class="section">
      <h2>➕ Convocar Novo Gnomo</h2>
      <form onsubmit="adicionarGnomo(event)" class="form">
        <div class="form-group">
          <input type="text" id="gnome_name" placeholder="Nome do Gnomo" required>
        </div>
        <div class="form-group">
          <input type="text" id="gnome_atribute" placeholder="Atributo (ex: Fogo, Lógico, Ágil)" required>
        </div>
        <button type="submit" class="btn btn-success">Registrar Gnomo</button>
      </form>
    </section>

    <section class="section">
      <h2>➗ Registrar Nova Fórmula</h2>
      <form onsubmit="adicionarFormula(event)" class="form">
        <div class="form-group">
          <input type="number" id="formula_gnome_id" placeholder="ID do Gnomo Dono" required>
        </div>
        <div class="form-group">
          <input type="text" id="formula_desc" placeholder="Descrição (ex: Área do Círculo)">
        </div>
        <div class="form-group">
          <input type="text" id="formula_exp" placeholder="Expressão (ex: x + y + z = 3)" required>
        </div>
        <button type="submit" class="btn btn-info">Gravar Fórmula</button>
      </form>
    </section>

    <section class="section">
      <h2>📑 Pergaminho de Resultados</h2>
      <textarea id="resultado" readonly class="resultado"></textarea>
    </section>

    <section class="section">
      <h2>🔍 Buscar por Gnomo</h2>
      <div class="search-form">
        <input type="number" id="buscaGnomeId" placeholder="ID do Gnomo">
        <button onclick="buscarFormulasPorGnomo()" class="btn btn-info">Ver Fórmulas Por ID do Gnomo</button>
      </div>
    </section>

    <section class="section">
      <h2>🗑️ Remover Conhecimento</h2>
      <div class="search-form">
        <input type="number" id="deletarFormulaId" placeholder="ID da Fórmula">
        <button onclick="deletarFormula()" class="btn btn-danger">Apagar Fórmula</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
